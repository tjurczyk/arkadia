name: Publish to Mudlet package repository

# TEST BRANCH (test/publish-403). See the branch's first commit for why this
# file is a diagnostic rather than the real publish workflow.
#
# packages.mudlet.org is behind Cloudflare, which answers a runner with a
# managed challenge before Vercel ever sees the request. This run works out
# *what* Cloudflare is scoring, by varying one thing at a time:
#
#   - path:   the site root vs the API route, to tell a rule aimed at /api
#             from something applied to the whole zone
#   - method: GET vs POST
#   - agent:  curl's default User-Agent vs a browser's, to tell a header
#             heuristic (Browser Integrity Check, Bot Fight Mode's signature
#             list) from a judgement about the IP itself
#   - client: curl vs node's fetch, which differ in TLS fingerprint - so if
#             curl passes where node does not, the scoring is on JA3/JA4 and
#             no header will fix it
#
# A row that reaches the origin carries x-vercel-* headers; a challenged one
# carries cf-mitigated instead. That column is the answer.
#
# The real publish is behind an input so a diagnostic run has no side effects -
# a successful one opens a pull request on Mudlet/mudlet-package-repository.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also attempt the real publish (opens a PR if it works)"
        type: boolean
        default: false
  push:
    branches: [test/publish-403]

permissions:
  contents: read
  id-token: write

env:
  ENDPOINT: https://packages.mudlet.org/api/publish
  AUDIENCE: https://packages.mudlet.org
  TAG: "4.112"
  UA_CHROME: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: What is Cloudflare scoring
        run: |
          set +e
          set -uo pipefail

          echo "runner egress IP: $(curl -sS --max-time 15 https://api.ipify.org)"
          echo

          probe() {
            local name="$1"; shift
            local dump code mitigated vercel
            dump=$(curl -sS -o /dev/null -D - -w '%{http_code}' --max-time 30 "$@" 2>&1)
            code=$(printf '%s' "$dump" | tail -1)
            mitigated=$(printf '%s\n' "$dump" | grep -i '^cf-mitigated:' | tr -d '\r' | cut -d' ' -f2)
            vercel=$(printf '%s\n' "$dump" | grep -ci '^x-vercel')
            printf '%-44s %-5s  mitigated=%-10s reached-origin=%s\n' \
              "$name" "$code" "${mitigated:-no}" "$([ "$vercel" -gt 0 ] && echo yes || echo NO)"
          }

          JSON='content-type: application/json'

          probe "GET  /          curl UA"    https://packages.mudlet.org/
          probe "GET  /          chrome UA"  https://packages.mudlet.org/ -H "user-agent: $UA_CHROME"
          probe "GET  /api/publish curl UA"  "$ENDPOINT"
          probe "GET  /api/publish chrome UA" "$ENDPOINT" -H "user-agent: $UA_CHROME"
          probe "POST /api/publish curl UA"  "$ENDPOINT" -X POST -H "$JSON" -d '{}'
          probe "POST /api/publish chrome UA" "$ENDPOINT" -X POST -H "$JSON" -d '{}' -H "user-agent: $UA_CHROME"
          probe "POST /api/publish browserish" "$ENDPOINT" -X POST -H "$JSON" -d '{}' \
            -H "user-agent: $UA_CHROME" \
            -H 'accept: application/json, text/plain, */*' \
            -H 'accept-language: en-GB,en;q=0.9' \
            -H 'origin: https://packages.mudlet.org' \
            -H 'referer: https://packages.mudlet.org/upload'

      - name: The same two POSTs from node's fetch
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            // curl and node do not present the same TLS handshake. If node is
            // challenged where curl was not, the scoring is below HTTP and
            // spoofing a User-Agent cannot help.
            const run = async (label, headers) => {
              const response = await fetch(process.env.ENDPOINT, {
                method: 'POST',
                headers: { 'content-type': 'application/json', ...headers },
                body: '{}',
              })
              await response.text()
              core.info(
                `${label.padEnd(28)} ${response.status}  ` +
                `mitigated=${response.headers.get('cf-mitigated') ?? 'no'}  ` +
                `reached-origin=${response.headers.get('x-vercel-id') ? 'yes' : 'NO'}`,
              )
            }

            await run('node, default UA', {})
            await run('node, chrome UA', { 'user-agent': process.env.UA_CHROME })

  publish:
    needs: fingerprint
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Submit to packages.mudlet.org
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.TAG,
            })
            const asset = release.assets.find(a => a.name === 'arkadia.mpackage')
            if (!asset) throw new Error(`release ${process.env.TAG} has no arkadia.mpackage asset`)

            const token = await core.getIDToken(process.env.AUDIENCE)
            const response = await fetch(process.env.ENDPOINT, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ artifactUrl: asset.browser_download_url }),
            })

            const raw = await response.text()
            core.info(`HTTP ${response.status}`)
            core.info(raw.slice(0, 2000))

            if (!response.ok) {
              let parsed = {}
              try { parsed = JSON.parse(raw) } catch {}
              throw new Error(parsed.error || `publish failed with HTTP ${response.status}`)
            }
            const result = JSON.parse(raw)
            core.notice(`arkadia ${result.version} submitted: ${result.pullRequest}`)
