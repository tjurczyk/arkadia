name: Publish to Mudlet package repository

# TEST BRANCH (test/publish-403). Diagnostic build of the publish step, cut
# down so it can be re-run as many times as we like without cutting a release.
#
# It keeps the one thing that matters: the file path. The registry pins
# job_workflow_ref by path only - .github/workflows/publish-package-repository.yml
# - and puts no `ref` condition on arkadia, so a run from this branch is
# authorised exactly as a run from master is. The tag rule on artifactUrl only
# applies to runs on a tag, so a branch run may point at any release asset, and
# this one points at the 4.112 one that is already attached.
#
# Building, the version check and the release upload are all gone: none of them
# has anything to do with the 403, and each of them needs a release.
#
# Three probes, in order, each allowed to run whatever the one before it did:
#   1. an unauthenticated POST - if this comes back as the endpoint's own JSON
#      401 then nothing in front of the site is blocking runners wholesale
#   2. the same POST with a real OIDC token, headers and body dumped raw
#   3. the node fetch the real workflow uses, so the failing path is reproduced
#      exactly rather than approximated by curl
#
# Delete this branch once the cause is found.

on:
  workflow_dispatch:
  push:
    branches: [test/publish-403]

permissions:
  contents: read
  id-token: write

env:
  ENDPOINT: https://packages.mudlet.org/api/publish
  AUDIENCE: https://packages.mudlet.org
  TAG: "4.112"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 1 - unauthenticated POST
        run: |
          set -uo pipefail
          echo "::group::response"
          curl -sS -i -X POST "$ENDPOINT" \
            -H 'content-type: application/json' \
            --max-time 30 -d '{}' | head -c 2000
          echo
          echo "::endgroup::"

      - name: Probe 2 - authenticated POST, raw
        if: always()
        run: |
          set -uo pipefail

          # The same token core.getIDToken() asks for, minted straight from the
          # runner's OIDC service so curl can carry it.
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpackages.mudlet.org" \
            | jq -r .value)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "could not mint an OIDC token"; exit 1
          fi

          # Which run this token describes, so a rejection about the claims can
          # be read without decoding anything by hand. Signature dropped.
          echo "::group::token claims"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ n = length % 4; printf "%s%s", $0, substr("===", 1, n ? 4 - n : 0) }' \
            | base64 -d 2>/dev/null | jq '{repository, repository_id, repository_owner_id, ref, job_workflow_ref, runner_environment, aud}'
          echo "::endgroup::"

          ASSET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/arkadia.mpackage"

          echo "::group::response"
          curl -sS -i -X POST "$ENDPOINT" \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            --max-time 60 \
            -d "{\"artifactUrl\":\"$ASSET\"}" | head -c 4000
          echo
          echo "::endgroup::"

      - name: Probe 3 - the node fetch the real workflow uses
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.TAG,
            })
            const asset = release.assets.find(a => a.name === 'arkadia.mpackage')
            if (!asset) throw new Error(`release ${process.env.TAG} has no arkadia.mpackage asset`)

            const token = await core.getIDToken(process.env.AUDIENCE)

            const response = await fetch(process.env.ENDPOINT, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ artifactUrl: asset.browser_download_url }),
            })

            // Read as text, not json: the whole question is what a body that
            // is not the endpoint's JSON actually says, and .json() throws it
            // away before anyone can look.
            const raw = await response.text()
            core.info(`HTTP ${response.status} ${response.statusText}`)
            for (const [name, value] of response.headers) core.info(`${name}: ${value}`)
            core.info('--- body ---')
            core.info(raw.slice(0, 4000))

            if (!response.ok) {
              let parsed = {}
              try { parsed = JSON.parse(raw) } catch {}
              throw new Error(parsed.error || `publish failed with HTTP ${response.status}`)
            }

            const result = JSON.parse(raw)
            core.notice(`arkadia ${result.version} submitted: ${result.pullRequest}`)
