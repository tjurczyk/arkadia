name: Publish to Mudlet package repository

# Builds arkadia.mpackage for a release, attaches it to that release, and
# submits it to packages.mudlet.org.
#
# No token is stored for this. The job asks GitHub for a short-lived OIDC token
# describing this run, and the package repository decides whether to accept it
# from its trusted-publishers.json - which registers this repository and this
# workflow file by path. Moving the publish step to another workflow file, or
# into a reusable workflow, will stop it being accepted.
#
# This workflow owns arkadia.mpackage end to end so nothing races it: building
# it here rather than in notify-discord.yml means the asset is guaranteed to
# exist by the time it is submitted.
#
# The publish opens a pull request against Mudlet/mudlet-package-repository; a
# maintainer still merges it.
#
# NOTE: the upstream "Validate mpackage file" workflow greps the unpacked
# archive for os.exec|lfs.rmdir|sysDataSendRequest and fails on a hit. This
# package legitimately uses sysDataSendRequest (12 handlers) and lfs.rmdir, so
# that check fails and auto-merge will not fire -- every PR needs a Mudlet
# maintainer to review and merge it by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true

permissions:
  contents: write # attach the built .mpackage to the release
  id-token: write # mint the OIDC token that authenticates the publish

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the release tag matches scripts.ver
        run: |
          set -euo pipefail

          # The version in the archive is stamped from skrypty.lua, and the
          # release is tagged by hand. notify-discord.yml raises the bump as a
          # pull request *after* a release, so if that pull request has not been
          # merged when the next release is cut, the tag moves on while
          # skrypty.lua does not - and this would publish a second, different
          # archive claiming to be the version already on the shelf. Tags are
          # unique, so that mismatch is the only way to ship a duplicate
          # version, and it is silent unless something looks.
          WANT="${TAG#v}"
          GOT=$(sed -nE 's/.*ver[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/p' skrypty.lua | head -1)

          if [ -z "$GOT" ]; then
            echo "Error: could not read the version out of skrypty.lua"
            exit 1
          fi

          if [ "$WANT" != "$GOT" ]; then
            echo "Error: release ${TAG} does not match scripts.ver ${GOT} in skrypty.lua."
            echo
            echo "The version bump for this release has most likely not been merged yet -"
            echo "look for an open 'version bump' pull request, merge it, then re-run this"
            echo "workflow. Publishing now would put a second archive labelled ${GOT} into"
            echo "the package repository, and nothing would offer it as an upgrade."
            exit 1
          fi

          echo "Pass: release ${TAG} matches scripts.ver ${GOT}"

      - name: Build Arkadia mpackage
        run: python ./.github/workflows/build_mpackage.py arkadia.mpackage

      - name: Attach it to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: arkadia.mpackage
          asset_name: arkadia.mpackage
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Submit to packages.mudlet.org
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.TAG
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            })

            const asset = release.assets.find(a => a.name === 'arkadia.mpackage')
            if (!asset) {
              throw new Error(`release ${tag} has no arkadia.mpackage asset`)
            }

            // Minted for this run only, expires in minutes, and usable nowhere
            // else: the audience pins it to the package repository.
            const token = await core.getIDToken('https://packages.mudlet.org')

            const response = await fetch('https://packages.mudlet.org/api/publish', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ artifactUrl: asset.browser_download_url }),
            })

            const result = await response.json().catch(() => ({}))
            if (!response.ok) {
              throw new Error(result.error || `publish failed with HTTP ${response.status}`)
            }

            core.notice(`arkadia ${result.version} submitted: ${result.pullRequest}`)
